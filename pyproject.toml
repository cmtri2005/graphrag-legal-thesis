[project]
name = "vilexgraph"
version = "0.1.0"
description = "Temporal-aware GraphRAG for Vietnamese legal text: vbpl.vn crawler, versioned legal graph, retrieval and ViLexTime benchmark"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
graph = ["neo4j>=5.24", "pymilvus>=2.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
