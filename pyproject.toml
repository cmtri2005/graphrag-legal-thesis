[project]
name = "legal-crawler"
version = "0.1.0"
description = "vbpl.vn crawler for temporal-aware Vietnamese legal knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
graph = ["neo4j>=5.24", "pymilvus>=2.4"]
tables = ["pyarrow>=17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
