[project]
name = "legal-crawler"
version = "0.1.0"
description = "vbpl.vn crawler for temporal-aware Vietnamese legal knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
neo4j = ["neo4j>=6.0,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
