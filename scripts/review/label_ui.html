<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gán nhãn ViLexTime</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#dedcd3;--acc:#2f6b3a;--bad:#b3261e;--hl:#c00000;--chip:#eceae2;--warn:#d9a400}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#202220;--ink:#ecebe5;--mute:#a09f97;--line:#363834;--acc:#6fbf80;--bad:#f2766e;--hl:#ff8a80;--chip:#2c2e2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#202220;--ink:#ecebe5;--mute:#a09f97;--line:#363834;--acc:#6fbf80;--bad:#f2766e;--hl:#ff8a80;--chip:#2c2e2b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:15px}
.bar{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
select,button,input,textarea{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.tab{border:0;background:none;padding:4px 10px;border-radius:14px;cursor:pointer;font-size:15px}
.tab.on{background:var(--chip);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:12px}
.tags span{display:inline-block;background:var(--chip);border-radius:12px;padding:0 10px;margin:0 6px 6px 0;font-size:14px}
h4{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.q{font-size:22px;line-height:1.5}
textarea.edit{display:block;width:100%;border:1px dashed var(--line);background:transparent;resize:vertical;padding:4px 8px;font-family:inherit}
textarea.edit:focus{border-style:solid;border-color:var(--acc);outline:none}
textarea.edit.changed{border-color:var(--warn);border-style:solid}
.ans{white-space:pre-wrap}.ans b{color:var(--hl)}
.hint{border-left:4px solid var(--warn);background:rgba(217,164,0,.12);padding:8px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:16px;margin-top:12px}
.hint h4{color:var(--warn)}
details{margin-top:10px}summary{cursor:pointer;color:var(--mute);font-size:15px}
pre{white-space:pre-wrap;font:15px/1.55 inherit;margin:8px 0 0}
aside{position:sticky;top:60px;align-self:start}
.v{display:flex;gap:8px}
.v button{flex:1;padding:14px;font-size:20px;border:2px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.v button.on.d{background:var(--acc);border-color:var(--acc);color:#fff}
.v button.on.k{background:var(--bad);border-color:var(--bad);color:#fff}
.fam{margin:10px 0 0}.fam h4{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chips label,.chips button{background:var(--chip);border:1px solid transparent;border-radius:16px;padding:2px 10px;font-size:14px;cursor:pointer}
.chips label.on,.chips button.on{border-color:var(--acc);background:rgba(47,107,58,.18)}
.fam .chips label.on{border-color:var(--bad);background:rgba(179,38,30,.15)}
kbd{opacity:.55;margin-right:4px;font:inherit}
.f{display:block;margin:10px 0 2px;font-size:14px;color:var(--mute)}
.f+input,.f+textarea{width:100%}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.nav .go{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.err{color:var(--bad);font-size:15px;margin-top:8px}
.mute{color:var(--mute);font-size:14px}
ol{padding-left:20px;font-size:15px;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.row{cursor:pointer}tr.row:hover{background:var(--chip)}
#stats{max-width:900px;margin:16px auto;padding:0 16px}
.tl{margin-top:14px;overflow-x:auto;padding:24px 0 6px}
.tlbar{position:relative;display:flex;gap:3px;min-width:calc(var(--n) * 120px)}
.seg{flex:1 1 0;min-width:0;background:var(--chip);border:1px solid transparent;border-radius:6px;padding:4px 8px;font-size:13px;line-height:1.35}
.seg b,.seg span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg span{color:var(--mute)}
.seg.mine{background:var(--acc);color:var(--card)}.seg.mine span{color:inherit;opacity:.85}
.seg.gone{background:repeating-linear-gradient(135deg,var(--chip) 0 6px,transparent 6px 12px);border-color:var(--line)}
.seg.gone.mine{border:2px solid var(--bad);color:var(--ink)}
.pin{position:absolute;top:-24px;height:24px;border-left:2px solid var(--ink);pointer-events:none}
.pin em{position:absolute;top:0;left:4px;font:600 12px/1.5 system-ui,sans-serif;background:var(--ink);color:var(--card);padding:0 6px;border-radius:4px;white-space:nowrap}
.pin.r em{left:auto;right:4px}
.tlnote{font-size:13px;color:var(--mute)}.tlnote .err{display:inline;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:700px){.cmp{grid-template-columns:1fr}}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.cmp>div.own{border:2px solid var(--acc)}
.cmp .old b{color:var(--bad);background:rgba(179,38,30,.14)}
.cmp .new b{color:var(--acc);background:rgba(47,107,58,.16)}
</style></head>
<body>
<header>
  <b id="who"></b>
  <label id="whoBox" hidden>Tôi là <select id="whoSel"><option value="A">A</option><option value="B">B</option></select></label>
  <span id="sync" class="mute"></span>
  <button class="tab on" id="t_label" onclick="tab('label')">Gán nhãn</button>
  <button class="tab" id="t_stats" onclick="tab('stats')">Tổng quan</button>
  <span id="prog"></span><div class="bar"><i id="barfill" style="width:0"></i></div>
  <label>Lô <select id="lo"></select></label>
  <label><input type="checkbox" id="todo" checked> chỉ dòng chưa gán</label>
  <span id="clock" class="mute"></span>
</header>
<main id="label"><section id="left"></section><aside id="right"></aside></main>
<div id="stats" hidden></div>
<script>
let S, view = [], pos = 0, t0 = Date.now(), spent = {}, draft = {};
const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const done = r => !!r.verdict && r.guideline_version === S.guideline;   // a carried D4 label is reconfirmed under the current guide
const list = s => (s || "").split(",").map(x => x.trim()).filter(Boolean);

function hl(text, sp) {
  if (!sp || !sp.length) return esc(text);
  let o = "", a = 0;
  for (const [s, e] of sp) { o += esc(text.slice(a, s)) + "<b>" + esc(text.slice(s, e)) + "</b>"; a = e; }
  return o + esc(text.slice(a));
}

function tab(name) {
  $("label").hidden = name !== "label"; $("stats").hidden = name !== "stats";
  $("t_label").classList.toggle("on", name === "label"); $("t_stats").classList.toggle("on", name === "stats");
  if (name === "stats") stats();
}

function refresh(keepId) {
  const lo = $("lo").value, todo = $("todo").checked;
  view = S.rows.filter(r => (lo === "*" || r.lo === lo) && (!todo || !done(r) || r.id === keepId));
  pos = keepId ? Math.max(0, view.findIndex(r => r.id === keepId)) : 0;
  progress(); show();
}

function progress() {
  const lo = $("lo").value, rs = S.rows.filter(r => lo === "*" || r.lo === lo), n = rs.filter(done).length;
  $("prog").textContent = `${n}/${rs.length} dòng` + (lo === "*" ? "" : ` (lô ${lo})`);
  $("barfill").style.width = (100 * n / Math.max(1, rs.length)) + "%";
}

const cur = () => view[pos];

// chips that fill the "evidence" boxes from the row's own text: the person ticks what they actually read
function actors(r) { return [...(r.trich_van_ban_tac_dong || "").matchAll(/^\[\w+\] (.+?) · ký/gm)].map(m => m[1]); }
function changeDates(r) { return [...(r.cac_phien_ban || "").matchAll(/^\[\d+\] (\d{4}-\d\d-\d\d) →/gm)].map(m => m[1]).slice(1); }

// The timeline bar: one equal slot per version, one for the repeal. Boundary rows sit a day from the change,
// so slots in proportion to time would put the pin on the line between two of them.
const short = by => (by || "").replace(/ \(hiệu lực [^)]*\)$/, "");
function timelineHtml(r) {
  const t = r.tl; if (!t || !t.versions.length) return "";
  const segs = t.versions.map(v => ({...v, label: `[${v.n}] ${short(v.by)}`}));
  if (t.repeal) segs.push({from: t.repeal.on, to: null, gone: true, mine: !t.versions.some(v => v.mine), label: `bãi bỏ · ${t.repeal.by}`});
  const at = segs.findIndex(s => (!s.from || s.from <= r.as_of) && (!s.to || r.as_of < s.to)), own = segs.findIndex(s => s.mine);
  let pin = "";
  if (at >= 0) {
    const s = segs[at], a = Date.parse(s.from || r.as_of), b = Date.parse(s.to || new Date().toISOString().slice(0, 10)), x = Date.parse(r.as_of);
    const left = 100 * (at + (b > a ? Math.min(.92, Math.max(.08, (x - a) / (b - a))) : .5)) / segs.length;
    pin = `<span class="pin${left > 70 ? " r" : ""}" style="left:${left.toFixed(1)}%"><em>mốc hỏi ${r.as_of}</em></span>`;
  }
  const warn = own >= 0 && at !== own ? ` · <span class="err">mốc hỏi rơi vào ${at >= 0 ? esc(segs[at].label) : "ngoài mọi phiên bản"}, còn đáp án là ${esc(segs[own].label)}: kiểm lại</span>` : "";
  return `<div class="tl"><div class="tlbar" style="--n:${segs.length}">${segs.map(s => `<div class="seg${s.mine ? " mine" : ""}${s.gone ? " gone" : ""}" title="${esc(s.label)}"><b>${esc(s.label)}</b><span>${s.from || "?"} → ${s.to || "nay"}</span></div>`).join("")}${pin}</div></div>
    <div class="tlnote">ô nổi bật = đáp án của dòng này${warn}</div>`;
}

// Each change in the lineage as old | new, the words that differ marked on both sides; the row's own version framed.
function compareHtml(r) {
  const c = S.compare[r.lineage_id]; if (!c) return "";
  const v = Object.fromEntries(c.versions.map(x => [x.n, x])), own = (r.tl.versions.find(x => x.mine) || {}).n;
  const side = (x, sp, cls) => `<div class="${cls}${x.n === own ? " own" : ""}"><h4 style="text-transform:none">[${x.n}] ${x.from || "?"} → ${x.to || "nay"}${x.n === own ? " · dòng này" : ""}</h4>${x.lead_in ? `<div class="mute">${esc(x.lead_in)}</div>` : ""}<div class="ans">${hl(x.text, sp)}</div></div>`;
  return `<div class="card"><h4>So sánh phiên bản <span class="mute" style="text-transform:none">(đỏ = bản cũ có mà bản mới bỏ hoặc đổi · xanh = bản mới thêm hoặc đổi)</span></h4>
    ${c.pairs.map(p => `<details ${[p.a, p.b].includes(own) ? "open" : ""}><summary>[${p.a}] → [${p.b}]${short(v[p.b].by) ? " · " + esc(short(v[p.b].by)) : ""}</summary><div class="cmp">${side(v[p.a], p.sa, "old")}${side(v[p.b], p.sb, "new")}</div></details>`).join("")}</div>`;
}

function show() {
  const r = cur(); t0 = Date.now();
  if (!r) { $("left").innerHTML = '<div class="card"><h4>Xong</h4>Không còn dòng nào trong bộ lọc này.</div>'; $("right").innerHTML = ""; return; }
  draft = Object.fromEntries(S.labels.map(c => [c, r[c] || ""]));
  const d = (t, x, open) => x ? `<details ${open ? "open" : ""}><summary>${t}</summary><pre>${esc(x)}</pre></details>` : "";
  const machine = [r.note_for_annotator, r.goi_y_cho_moi].filter(Boolean).join("\n\n");
  $("left").innerHTML = `
  <div class="card">
    <div class="tags"><span>${r.group}${r.subgroup && r.subgroup !== r.group ? " · " + r.subgroup : ""}</span><span>lô ${r.lo}</span><span>mốc hỏi ${r.as_of}</span><span>${esc(r.citation)} · ${esc(r.law_id)}</span><span>hiệu lực ${r.valid_from || "?"} → ${r.valid_to || "nay"}</span>${r.verdict && !done(r) ? "<span>nhãn D4 cũ (v" + (r.guideline_version || "1.2") + "): xác nhận lại theo " + S.guideline + "</span>" : ""}</div>
    <h4>Câu hỏi <span class="mute" style="text-transform:none">(sửa thẳng ở đây nếu cần; sửa một lần cho cả lineage)</span></h4>
    <textarea class="q edit" id="e_question" rows="3">${esc(r.question)}</textarea>
    ${timelineHtml(r)}
  </div>
  ${compareHtml(r)}
  <div class="card">
    <h4>Đáp án chuẩn <span style="text-transform:none">(chữ đỏ = chỗ đổi giữa các phiên bản)</span></h4>
    <div class="mute">${esc(r.lead_in)}</div>
    <div class="ans">${hl(r.answer || "(không có đáp án)", S.spans[r.id])}</div>
    ${answerable(r) ? `<h4 style="margin-top:12px">Đáp án ngắn <span class="mute" style="text-transform:none">(sửa được; phải chép nguyên văn từ đáp án hoặc câu dẫn, nhiều đoạn cách nhau …)</span></h4>
    <textarea class="edit" id="e_short_answer" rows="2">${esc(r.short_answer)}</textarea>` : ""}
    ${machine ? `<div class="hint"><h4>Máy gợi ý, có thể sai</h4>${esc(machine)}</div>` : ""}
  </div>
  <div class="card">
    ${d("Các phiên bản (dạng chữ)", r.cac_phien_ban, false)}
    ${d("Trích văn bản gốc", r.trich_van_ban_goc, false)}
    ${d("Trích văn bản tác động", r.trich_van_ban_tac_dong, r.group === "T6")}
    <details><summary>Nguồn</summary><a href="${esc(r.source_url)}" target="_blank" rel="noreferrer">${esc(r.source_url)}</a></details>
  </div>`;
  for (const k of ["question", "short_answer"]) {
    const e = $("e_" + k); if (e) e.oninput = () => e.classList.toggle("changed", e.value.trim() !== (r[k] || "").trim());
  }
  form();
}

const answerable = r => r.answer && !r.answer.startsWith("(không có đáp án");
function edited(r) {
  const out = {};
  for (const k of ["question", "short_answer"]) { const e = $("e_" + k); if (e && e.value.trim() !== (r[k] || "").trim()) out[k] = e.value; }
  return out;
}

function chipRow(field, items) {
  if (!items.length) return "";
  const have = new Set(list(draft[field]));
  return `<div class="chips">${items.map(x => `<button type="button" class="${have.has(x) ? "on" : ""}" onclick="toggle('${field}',this.dataset.v)" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;
}

function form() {
  const r = cur(), codes = new Set(list(draft.reasons)), bad = draft.verdict === "khong_dat";
  const fam = bad ? S.families.map(f => `<div class="fam"><h4>${f.name}</h4><div class="chips">${f.codes.map(x =>
      `<label title="${esc(x.help)}" class="${codes.has(x.code) ? "on" : ""}"><input type="checkbox" hidden onchange="setR('${x.code}')"><kbd>${x.key}</kbd>${x.code}</label>`).join("")}</div></div>`).join("") : "";
  const acts = actors(r), dates = changeDates(r);
  $("right").innerHTML = `<div class="card">
    <div class="v"><button class="d ${draft.verdict === "dat" ? "on" : ""}" onclick="setV('dat')">Đạt <small>(D)</small></button><button class="k ${bad ? "on" : ""}" onclick="setV('khong_dat')">Không đạt <small>(K)</small></button></div>
    ${fam}
    <h4 style="margin-top:16px">Bằng chứng đã xem</h4>
    <label class="f">Văn bản tác động đã đọc <span class="mute">(bắt buộc; bấm để chọn, hoặc gõ)</span></label>
    ${chipRow("da_xem_van_ban_tac_dong", acts)}<input id="f_da_xem_van_ban_tac_dong" value="${esc(draft.da_xem_van_ban_tac_dong)}">
    ${["T2", "T3"].includes(r.group) ? `<label class="f">Câu hỏi chạm lần sửa nào <span class="mute">(T2/T3 bắt buộc)</span></label>${chipRow("cham_lan_sua", dates)}<input id="f_cham_lan_sua" value="${esc(draft.cham_lan_sua)}">` : ""}
    ${r.group === "T6" ? `<label class="f">Nội dung còn ở đâu <span class="mute">(T6 bắt buộc)</span></label><div class="chips"><button type="button" onclick="fill('noi_dung_con_o_dau','Không thấy nơi kế thừa')">không thấy nơi kế thừa</button></div><textarea id="f_noi_dung_con_o_dau" rows="2">${esc(draft.noi_dung_con_o_dau)}</textarea>` : ""}
    <label class="f">Ghi chú <kbd>N</kbd><span class="mute">(bắt buộc với gold_wrong, other, relocated, superseded_by_other_norm)</span></label>
    <textarea id="f_note" rows="3">${esc(draft.note)}</textarea>
    <label class="f">Phút <span class="mute">(để trống = máy tự tính)</span></label><input id="f_phut" size="4" value="${esc(draft.phut)}">
    <div id="msg"></div>
    <div class="nav"><button onclick="go(-1)">←</button><button class="go" onclick="saveNext()">Lưu & tiếp ⏎</button><button onclick="go(1)">→</button></div>
    <details><summary>8 điều kiện cần kiểm</summary><ol>${S.decision.map(x => `<li>${esc(x[1])} <b>${esc(x[2])}</b></li>`).join("")}</ol></details>
  </div>`;
  for (const c of ["da_xem_van_ban_tac_dong", "cham_lan_sua", "noi_dung_con_o_dau", "note", "phut"]) {
    const e = $("f_" + c); if (e) e.oninput = () => draft[c] = e.value;
  }
}

function toggle(field, v) { const s = new Set(list(draft[field])); s.has(v) ? s.delete(v) : s.add(v); draft[field] = [...s].join(", "); form(); }
function fill(field, v) { draft[field] = v; form(); }
function setV(v) { draft.verdict = v; if (v === "dat") draft.reasons = ""; form(); }
function setR(c) { const s = new Set(list(draft.reasons)); s.has(c) ? s.delete(c) : s.add(c); draft.reasons = [...s].join(", "); if (s.size) draft.verdict = "khong_dat"; form(); }
function go(d) { if (!view.length) return; pos = Math.min(view.length - 1, Math.max(0, pos + d)); show(); }

async function saveNext() {
  const r = cur(); if (!r) return;
  const secs = (spent[r.id] || 0) + (Date.now() - t0) / 1000; spent[r.id] = secs;
  const label = {...draft}; if (!label.phut) label.phut = String(Math.max(1, Math.round(secs / 60)));
  const res = EMB ? await hostedSave(r, label, edited(r))
    : await (await fetch("/api/save", {method: "POST", body: JSON.stringify({id: r.id, label, edits: edited(r)})})).json();
  if (res.errors.length) { $("msg").innerHTML = '<div class="err">' + res.errors.map(esc).join("<br>") + "</div>"; return; }
  const byId = Object.fromEntries(S.rows.map(x => [x.id, x]));
  for (const x of res.rows) if (byId[x.id]) Object.assign(byId[x.id], x);   // a question edit reaches its whole lineage
  const next = view.slice(pos + 1).find(x => !done(x)) || view.find(x => !done(x));
  progress(); if (next) { pos = view.indexOf(next); show(); } else refresh();
}

function stats() {
  const los = [...new Set(S.rows.map(r => r.lo))].sort((a, b) => a - b), sum = a => a.reduce((x, y) => x + y, 0);
  const line = (name, rs, lo) => {
    const g = rs.filter(done), mins = g.map(r => +r.phut).filter(Boolean);
    return `<tr class="row" onclick="$('lo').value='${lo}';$('todo').checked=true;tab('label');refresh()"><td>${name}</td><td>${rs.length}</td><td>${g.length}</td><td>${g.filter(r => r.verdict === "dat").length}</td><td>${g.filter(r => r.verdict === "khong_dat").length}</td><td>${mins.length ? (sum(mins) / mins.length).toFixed(1) : "—"}</td></tr>`;
  };
  const codes = {}; S.rows.forEach(r => list(r.reasons).forEach(c => codes[c] = (codes[c] || 0) + 1));
  const left = S.rows.filter(r => !done(r)), meanAll = (() => { const m = S.rows.filter(done).map(r => +r.phut).filter(Boolean); return m.length ? sum(m) / m.length : 0; })();
  $("stats").innerHTML = `<div class="card"><h4>Theo lô (bấm để vào lô)</h4><table><tr><th>Lô</th><th>Tổng</th><th>Đã gán</th><th>Đạt</th><th>Không đạt</th><th>Phút/dòng</th></tr>
    ${line("Tất cả", S.rows, "*")}${los.map(l => line("Lô " + l, S.rows.filter(r => r.lo === l), l)).join("")}</table></div>
    <div class="card"><h4>Còn lại</h4>${left.length} dòng chưa gán${meanAll ? `, ước <b>${(left.length * meanAll / 60).toFixed(1)} giờ</b> theo ${meanAll.toFixed(1)} phút/dòng đã đo` : ""}.</div>
    <div class="card"><h4>Mã lý do đã dùng</h4>${Object.entries(codes).sort((a, b) => b[1] - a[1]).map(([c, n]) => `${c}: ${n}`).join(" · ") || "chưa có"}</div>`;
}

document.addEventListener("keydown", e => {
  const tag = document.activeElement.tagName, typing = /INPUT|TEXTAREA|SELECT/.test(tag) && document.activeElement.type !== "checkbox";
  if ($("label").hidden) return;
  if (e.key === "Enter" && (tag !== "TEXTAREA" || e.ctrlKey) && tag !== "BUTTON" && tag !== "SELECT") { e.preventDefault(); return saveNext(); }
  if (e.ctrlKey || e.metaKey || e.altKey || typing) return;
  const k = e.key.toLowerCase();
  if (k === "d") setV("dat"); else if (k === "k") setV("khong_dat");
  else if (k === "n") { e.preventDefault(); $("f_note").focus(); }
  else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (draft.verdict === "khong_dat") { const x = S.families.flatMap(f => f.codes).find(x => x.key === k); if (x) setR(x.code); }
});
document.addEventListener("visibilitychange", () => {
  const r = cur(); if (!r) return;
  if (document.hidden) spent[r.id] = (spent[r.id] || 0) + (Date.now() - t0) / 1000; else t0 = Date.now();
});
function tick() { const r = cur(), s = r ? (spent[r.id] || 0) + (Date.now() - t0) / 1000 : 0; $("clock").textContent = r ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : ""; }

function start(s) {
  S = s; $("who").textContent = "Phiếu " + s.who + (s.held ? ` · ${s.held} dòng ẩn chờ gold` : "");
  const los = [...new Set(s.rows.map(r => r.lo))].sort((a, b) => a - b);
  $("lo").innerHTML = '<option value="*">tất cả</option>' + los.map(l => `<option>${l}</option>`).join("");
  const first = s.rows.find(r => !done(r)); $("lo").value = first ? first.lo : "*";
  $("lo").onchange = $("todo").onchange = () => refresh();
  refresh();
}

// On claude.ai (label_ui.py --web) both sheets ship inside the page and labels live in the page's database, one
// document per row in `kiem_A` / `kiem_B`; label_ui.py --pull writes them back to the TSV through the same save().
const EMB = document.getElementById("states");
let DB = null, UID = null, READY = false, DOCS = {}, LATEST = {};
const verOf = r => { const v = (r.tl.versions.find(x => x.mine) || {}).n; return v ? r.lineage_id + "#" + v : null; };
const words = t => ((t || "").toLowerCase().match(/[\p{L}\p{N}_]+/gu) || []).join(" ");
function shortOk(s, r) {   // enrich_vilextime.check_short_answer
  const src = ` ${words(r.answer)} | ${words(r.lead_in)} `, sp = (s || "").split("…").map(words);
  return sp.length > 0 && sp.every(x => x && src.includes(` ${x} `));
}
function check(r, l, e) {   // label_ui.validate + missing_fields + check_edits; --pull runs the Python ones again
  const codes = list(l.reasons), err = [], has = c => (l[c] || "").trim();
  if (!["dat", "khong_dat"].includes(l.verdict)) err.push("chưa chọn dat / khong_dat");
  if (l.verdict === "khong_dat" && !codes.length) err.push("khong_dat nhưng chưa chọn mã lý do");
  if (l.verdict === "dat" && codes.length) err.push("dat nhưng vẫn còn mã lý do");
  const needs = codes.filter(c => S.needs_note.includes(c)).sort();
  if (needs.length && !has("note")) err.push(needs.join("/") + " bắt buộc có note");
  if (S.who === "A") {
    if (!has("da_xem_van_ban_tac_dong")) err.push("thiếu da_xem_van_ban_tac_dong");
    if (["T2", "T3"].includes(r.group) && !has("cham_lan_sua")) err.push("T2/T3 thiếu cham_lan_sua");
    if (r.group === "T6" && !has("noi_dung_con_o_dau")) err.push("T6 thiếu noi_dung_con_o_dau");
    if (!/^\d+$/.test(has("phut"))) err.push("phut phải là số phút (số nguyên)");
  }
  if ("question" in e && !e.question) err.push("câu hỏi không được để trống");
  if ("short_answer" in e) {
    if (!answerable(r)) err.push("dòng không có đáp án thì không có đáp án ngắn");
    else if (!shortOk(e.short_answer, r)) err.push("đáp án ngắn phải là đoạn trích nguyên văn của đáp án hoặc câu dẫn (nhiều đoạn cách nhau …)");
  }
  return err;
}
function apply(d, s = S) {   // one saved document onto the rows it reaches; a later edit of the same text wins
  const r = s.rows.find(x => x.id === d.id); if (!r) return [];
  Object.assign(r, d.label, {guideline_version: d.guideline});
  const out = [r], e = d.edits || {};
  for (const [kind, key, same] of [["question", r.lineage_id, x => x.lineage_id === r.lineage_id],
                                   ["short_answer", verOf(r), x => verOf(x) === verOf(r)]]) {
    const k = kind + "|" + key;
    if (!e[kind] || (LATEST[k] && LATEST[k] > e[kind].at)) continue;
    LATEST[k] = e[kind].at;
    for (const x of s.rows.filter(same)) { x[kind] = e[kind].text; out.push(x); }
  }
  return out;
}
async function hostedSave(r, raw, rawEdits) {
  if (!READY) return {rows: [], errors: [DB ? "Đang tải nhãn đã lưu, đợi vài giây rồi lưu lại." :
    "Chưa nối được chỗ lưu nhãn. Mở trang trên claude.ai khi đã đăng nhập, rồi tải lại trang."]};
  const label = Object.fromEntries(S.labels.map(c => [c, String(raw[c] || "").trim()]));
  const edits = Object.fromEntries(Object.entries(rawEdits).map(([k, v]) => [k, v.trim()]).filter(([k, v]) => v !== (r[k] || "").trim()));
  const errors = check(r, label, edits); if (errors.length) return {rows: [], errors};
  const at = new Date().toISOString(), kept = (DOCS[r.id] || {}).edits || {};
  const doc = {id: r.id, lo: r.lo, label, guideline: S.guideline, at, by: UID || "",
               edits: {...kept, ...Object.fromEntries(Object.entries(edits).map(([k, v]) => [k, {text: v, at}]))}};
  try { await DB.collection("kiem_" + S.who).doc(r.id.replaceAll("#", "~").replaceAll("%", "+"))   /* label_ui.doc_id */.set(doc); }
  catch (e) { return {rows: [], errors: [`Không lưu được (${e.code || e}). Bấm lưu lại; nếu vẫn lỗi, báo nhóm.`]}; }
  DOCS[r.id] = doc; $("sync").textContent = "đã lưu " + at.slice(11, 16);
  return {rows: apply(doc), errors: []};
}
async function openSheet(all, who) {
  READY = false; DOCS = {}; LATEST = {};
  start(all[who]);
  const s = S;   // the sheet this load is for: a switch to the other sheet meanwhile must not receive its labels
  if (!DB) return;
  $("sync").textContent = "đang tải nhãn đã lưu…";
  try {
    const col = DB.collection("kiem_" + who), docs = [];
    for (const lo of new Set(S.rows.map(r => r.lo))) (await col.where("lo", "==", lo).get()).docs.forEach(d => docs.push(d.data()));
    if (S !== s) return;
    docs.sort((a, b) => a.at < b.at ? -1 : 1).forEach(d => { DOCS[d.id] = d; apply(d, s); });
    READY = true;
    $("sync").textContent = `${docs.length} nhãn đã lưu trên web`;
    refresh(cur() && cur().id);
  } catch (e) { $("sync").textContent = `không tải được nhãn đã lưu (${e.code || e}); tải lại trang`; }
}
async function boot() {
  setInterval(tick, 1000);
  if (!EMB) return start(await (await fetch("/api/state")).json());
  const all = JSON.parse(EMB.textContent);
  let who = "A"; try { who = localStorage.getItem("vilextime-who") || "A"; } catch (e) {}
  $("whoBox").hidden = false; $("whoSel").value = who;
  $("whoSel").onchange = () => { try { localStorage.setItem("vilextime-who", $("whoSel").value); } catch (e) {} openSheet(all, $("whoSel").value); };
  start(all[who]);
  $("sync").textContent = "đang nối chỗ lưu…";
  DB = window.claude ? await window.claude.use("db") : null;
  const user = DB ? await window.claude.use("user") : null;
  UID = user ? await user.id() : null;
  if (!DB) { $("sync").textContent = "chưa nối được chỗ lưu: mở trên claude.ai khi đã đăng nhập"; return; }
  openSheet(all, $("whoSel").value);
}
boot();
</script></body></html>
