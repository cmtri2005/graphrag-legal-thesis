<title>Gán nhãn ViLexTime</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--ink:#172b38;--bg:#f4f6f8;--panel:#fff;--header:#12364a;--on-header:#fff;--border:#afbec7;--muted:#516673;--link:#075c88;--accent:#126352;--on-accent:#fff;--error:#a0182b;--mark:#ffe3a0;--strong:#713500;--focus:#075c88;color-scheme:light;font:17px/1.6 system-ui,sans-serif;color:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e2eaf0;--bg:#141b21;--panel:#1c2830;--header:#223d4c;--on-header:#f4f8fb;--border:#718591;--muted:#b0c1cd;--link:#8acfff;--accent:#78d4b9;--on-accent:#10271f;--error:#ff9cad;--mark:#614721;--strong:#ffd599;--focus:#8acfff;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e2eaf0;--bg:#141b21;--panel:#1c2830;--header:#223d4c;--on-header:#f4f8fb;--border:#718591;--muted:#b0c1cd;--link:#8acfff;--accent:#78d4b9;--on-accent:#10271f;--error:#ff9cad;--mark:#614721;--strong:#ffd599;--focus:#8acfff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header,main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}header{position:sticky;top:env(safe-area-inset-top, 0px);background:var(--header);color:var(--on-header);z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}main{max-width:1400px;margin:auto}button,select,textarea,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:5px;padding:7px 12px;background:var(--panel);color:var(--ink);max-width:100%;white-space:normal}button.primary{background:var(--accent);color:var(--on-accent)}button:disabled{cursor:wait;opacity:.65}section,.version{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin:18px 0;min-width:0}h1{font-size:1.5rem}h2{font-size:1.15rem;margin:0 0 12px}h3{font-size:1rem}.versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}.version{margin:0}pre,.legal{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}mark{background:var(--mark);color:var(--ink)}strong{font-weight:800;color:var(--strong)}label{display:block;margin:7px 0}label.inline{display:inline-block;margin-right:20px}textarea{width:100%;min-height:95px;border:1px solid var(--border);border-radius:5px;padding:10px;background:var(--panel);color:var(--ink)}select{max-width:100%;padding:5px;background:var(--panel);color:var(--ink);border:1px solid var(--border)}.muted{font-size:.9rem;color:var(--muted)}.error{color:var(--error);white-space:pre-wrap}.hide,[hidden]{display:none!important}a{color:var(--link)}.saved{color:var(--accent)}.q{border-top:1px solid var(--border);padding:14px 0}fieldset{padding:0;margin:0;border:0;min-width:0}#meta,#sync,summary,h1{overflow-wrap:anywhere}#sync{flex-basis:100%}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}header :focus-visible{outline-color:var(--on-header)}#card-text{max-height:65vh;overflow:auto;overflow-wrap:anywhere}#card-text table{border-collapse:collapse;width:100%;font-size:.95rem}#card-text th,#card-text td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:top}#card-text h2,#card-text h3{margin-top:24px}#card-text li{margin:6px 0}#card-text code{white-space:normal}input[type=radio]{accent-color:var(--accent)}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<header><b>ViLexTime · hướng dẫn 4.0</b><label for="who-select">Người gán <select id="who-select"><option value="">Chọn tên…</option><option value="A">Tôi là A</option><option value="B">Tôi là B</option></select></label><label for="batch-select">Lô <select id="batch-select"></select></label><button id="prev">← Trước</button><button id="next">Sau →</button><button id="pending">Câu chưa gán</button><span id="status" role="status"></span><span id="sync" role="status"></span><button id="retry">Kết nối lại</button></header>
<main><p>Gán độc lập, không trao đổi, phải mở văn bản gốc.</p><button id="card-toggle" aria-controls="card" aria-expanded="false">Xem hướng dẫn 4.0</button><section id="card" hidden><div id="card-text"></div></section><p id="identity-error" class="error" role="status"></p><div id="empty" class="hide">Lô chưa có câu hỏi.</div><div id="sheet"><h1 id="question"></h1><p id="meta" class="muted"></p><p id="timer" class="muted"></p><div id="versions" class="versions"></div><section><h2>Văn bản gốc và văn bản tác động</h2><div id="sources"></div></section><section><h2>Bốn câu hỏi kiểm</h2><form id="form" novalidate><fieldset id="entry"><div id="questions"></div><label for="quote">Câu trích nguyên văn từ văn bản tác động (bắt buộc)</label><textarea id="quote" aria-describedby="quote_error"></textarea><p id="quote_error" class="error"></p><label for="search_log">Đã tìm chuyển chỗ ở đâu? (bắt buộc nếu T6, Q4 = Không)</label><textarea id="search_log" aria-describedby="search_log_error"></textarea><p id="search_log_error" class="error"></p><label for="note">Ghi chú — chỗ mới/chỗ nghi, ý còn thiếu, hoặc [phân vân]</label><textarea id="note" aria-describedby="note_error"></textarea><p id="note_error" class="error"></p><p id="error" class="error" role="status"></p><button id="save" type="submit" class="primary">Lưu và sang câu chưa gán</button><span id="saved" class="saved" role="status"></span></fieldset></form></section></div></main>
<script>
"use strict";
const embedded=/*EMBEDDED_STATE*/null;
let state,index=0,who="",uid=null,db=null,ready=false,busy=false,blocked=false,generation=0;
let answers={},docs={},started=null,touched=new Set();
const $=id=>document.getElementById(id);
const titles={q1:"Q1. Đáp án ở mỗi mốc có đúng văn bản không?",q2:"Q2. Câu hỏi có hỏi vào đúng phần tô màu không?",q3:"Q3. Câu hỏi có rõ không?",q4:"Q4. Có quy định nào khác đang thay cho đáp án này không?"};
const help={q1:"Đọc câu sửa đổi/bãi bỏ và điều hiệu lực; đối chiếu cả lời văn và đáp án ngắn in đậm.",q2:"Ở các mốc, người trả lời phải nói những điều khác nhau không? T6 phải hỏi nội dung, không chỉ hỏi còn/hết.",q3:"Chỉ một điều khoản trả lời được; không lộ ngày, số hiệu, Điều/Khoản hay chép sẵn đáp án.",q4:"Kiểm quy phạm khác, sắp xếp bộ máy, chuyển tiếp. T6 kiểm đủ bảy yếu tố chuyển chỗ theo hướng dẫn 4.0 §3 Q4, Bước 7."};
const names={dung:"Đúng",sai:"Sai",co:"Có",khong:"Không",khong_chac:"Không chắc"};
const reasonNames={gold_wrong:"Sai phiên bản, ngày hoặc lời văn",reference_only:"Đáp án chỉ dẫn chiếu",other:"Đáp án ngắn thiếu ý",group_mismatch:"Không đúng nhóm",cosmetic_only:"Chỉ đổi hình thức",rename_only:"Chỉ đổi tên cơ quan",auto_reference_update:"Tự cập nhật dẫn chiếu",single_change:"Chỉ một đáp án pháp lý",question_ambiguous:"Câu hỏi mơ hồ",unanswerable_as_asked:"Không trả lời được như câu hỏi",question_leaks:"Lộ đáp án hoặc định danh",superseded_by_other_norm:"Quy phạm khác thay cho đáp án",restructuring_2025:"Sắp xếp bộ máy 2025",transitional_rule:"Vướng quy tắc chuyển tiếp",relocated:"Đã chuyển chỗ",relocation_unclear:"Chưa chắc chuyển chỗ"};
const node=(tag,text,cls)=>{let el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
function link(parent,url){try{let u=new URL(url);if(!["https:","http:"].includes(u.protocol))return;let a=node("a","Mở văn bản gốc ↗");a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";parent.append(a);return true}catch{}return false}
function sourceBlock(src,title){const box=node("details");box.open=true;box.append(node("summary",title+" "+(src.document||src.number||src.title||"")));const linked=link(box,src.source_url||src.url);if(!linked||![src.text,src.passage].some(s=>String(s||" ").trim()))box.append(node("p","Chưa trích được đoạn này. Mở văn bản gốc theo tên.","error"));for(const k of ["text","passage","transitional","in_force"]){if(src[k]){box.append(node("h3",{text:"Lời văn",passage:"Đoạn tác động",transitional:"Chuyển tiếp",in_force:"Hiệu lực"}[k]));box.append(node("pre",src[k]))}}return box}
const current=()=>state?.questions[index];
const visible=()=>state.questions.filter(r=>String(r.batch??0)===$("batch-select").value);
const fields=["q1","q2","q3","q4","quote","search_log","note"];
const draftKey=r=>"vilextime-the4:"+who+":"+(uid||"pending")+":"+r.lineage_id;
const chosen=q=>document.querySelector(`input[name="${q}"]:checked`)?.value||"";
function values(){const v={};for(const q of Object.keys(state.options)){v[q]=chosen(q);v[q+"_reason"]=$(q+"_reason").value}for(const k of ["quote","search_log","note"])v[k]=$(k).value.trim();return v}
function remember(r){if(!r||!who)return;try{localStorage.setItem(draftKey(r),JSON.stringify(answers[r.lineage_id]||{}))}catch{}}
function checkpoint(){const r=current();if(started!==null&&r){const a=answers[r.lineage_id]||={seconds:0};a.seconds=(Number(a.seconds)||0)+(performance.now()-started)/1000}started=null}
function capture(){checkpoint();const r=current();if(!r||!who||blocked||$("sheet").classList.contains("hide"))return;answers[r.lineage_id]={...answers[r.lineage_id],...values()};remember(r)}
function resume(){started=who&&!blocked&&!document.hidden&&current()?performance.now():null}
function reasonOptions(q,old=""){const sel=$(q+"_reason");sel.replaceChildren(node("option","Chọn lý do…"));sel.firstChild.value="";const choices=state.reasons[q][chosen(q)]||[];for(const c of choices){const o=node("option",c+" — "+(reasonNames[c]||c));o.value=c;sel.append(o)}sel.value=choices.includes(old)?old:"";sel.hidden=!choices.length;$(q+"_reason_label").hidden=!choices.length}
function validation(r,v){const err={};for(const q of Object.keys(state.options)){const value=(v[q]||"").trim(),reason=(v[q+"_reason"]||"").trim();if(!state.options[q].includes(value))err[q]="Chọn câu trả lời theo thẻ 4.0.";else if(value!==state.good[q]&&!(state.reasons[q][value]||[]).includes(reason))err[q]="Chọn một lý do đúng với câu trả lời.";else if(value===state.good[q]&&reason)err[q]="Câu trả lời đạt không kèm mã loại."}if(!v.quote?.trim())err.quote="Dán một câu trích nguyên văn từ văn bản tác động.";if(r.group==="T6"&&v.q4==="khong"&&!v.search_log?.trim())err.search_log="Ghi đã tìm chuyển chỗ ở đâu.";if(["relocated","relocation_unclear"].includes(v.q4_reason)&&!v.note?.trim())err.note="Ghi chỗ mới hoặc chỗ nghi chuyển chỗ.";if(v.q1_reason==="other"&&!v.note?.trim())err.note="Ghi ý còn thiếu trong đáp án ngắn.";return err}
function errors(all=false){if(all)touched=new Set(fields);const err=validation(current(),values());for(const k of fields){$(k+"_error").textContent=touched.has(k)?err[k]||"":"";if($(k))$(k).setAttribute("aria-invalid",String(touched.has(k)&&!!err[k]))}return err}
function changed(key){touched.add(key);if(key==="q1"||key==="q4"){touched.add("note");touched.add("search_log")}errors();capture();if(current())answers[current().lineage_id].edited=true;remember(current());resume()}
function show(){checkpoint();const r=current();$("empty").classList.toggle("hide",!!r);$("sheet").classList.toggle("hide",!r||!who||blocked);if(!r||!who||blocked){$("status").textContent="";return}
const own=answers[r.lineage_id]||{};touched=new Set();$("error").textContent="";$("saved").textContent="";
const batch=visible();$("status").textContent=`Đã lưu ${batch.filter(x=>docs[x.lineage_id]).length}/${batch.length} · câu ${batch.indexOf(r)+1}`;
$("question").textContent=r.question;$("meta").textContent=`${r.group} · ${r.stratum||""} · Lô ${r.batch??0} · ${r.lineage_id}`;
$("versions").replaceChildren();for(const v of r.rows){const box=node("article",undefined,"version");box.append(node("h2",v.as_of||"Chưa có mốc"));box.append(node("p",v.version_id||"Không có phiên bản còn hiệu lực","muted"));if(v.answer_status==="no_answer")box.append(node("p","Không có đáp án ở mốc này — điều khoản đã bị bãi bỏ."));if(v.marked_lead_in){box.append(node("h3","Câu dẫn (ngữ cảnh từ chuỗi phiên bản)"));const lead=node("div",undefined,"legal");lead.innerHTML=v.marked_lead_in;box.append(lead)}const legal=node("div",undefined,"legal");legal.innerHTML=v.marked_answer;box.append(legal);if(v.short_answer)box.append(node("p","Đáp án ngắn: "+v.short_answer));link(box,v.source_url);$("versions").append(box)}
$("sources").replaceChildren();let sources=r.sources||{};if(sources.base)$("sources").append(sourceBlock(sources.base,"Văn bản đích"));for(const s of sources.actors||[])$("sources").append(sourceBlock(s,"Văn bản tác động"));if(!sources.base&&!(sources.actors||[]).length)for(const v of r.rows){let s=v.source_evidence||{};if(s.base)$("sources").append(sourceBlock(s.base,"Văn bản đích"));for(const a of s.actors||[])$("sources").append(sourceBlock(a,"Văn bản tác động"))}

$("questions").replaceChildren();for(const q of Object.keys(titles)){const div=node("div",undefined,"q");div.append(node("h3",titles[q]),node("p",help[q],"muted"));for(const value of state.options[q]){const lab=node("label",undefined,"inline"),input=document.createElement("input");input.type="radio";input.name=q;input.id=q+"_"+value;input.value=value;input.checked=own[q]===value;input.setAttribute("aria-describedby",q+"_error");input.onchange=()=>{reasonOptions(q);changed(q)};lab.htmlFor=input.id;lab.append(input,document.createTextNode(" "+names[value]));div.append(lab)}const lab=node("label","Lý do");lab.id=q+"_reason_label";lab.htmlFor=q+"_reason";const sel=document.createElement("select");sel.id=q+"_reason";sel.setAttribute("aria-describedby",q+"_error");sel.onchange=()=>changed(q);const err=node("p","","error");err.id=q+"_error";div.append(lab,sel,err);$("questions").append(div);reasonOptions(q,own[q+"_reason"]||"")}
for(const k of ["quote","search_log","note"])$(k).value=own[k]||"";errors();resume();timer();$("entry").disabled=busy;
}
function timer(){const r=current();if(!r)return;const seconds=(Number(answers[r.lineage_id]?.seconds)||0)+(started===null?0:(performance.now()-started)/1000);$("timer").textContent=`Thời gian đang hiển thị câu này: ${Math.floor(seconds)} giây (cộng dồn)`}
function nextPending(){const batch=visible(),pos=batch.indexOf(current());for(let step=1;step<=batch.length;step++){const r=batch[(pos+step)%batch.length];if(!docs[r.lineage_id]){index=state.questions.indexOf(r);return}}index=state.questions.indexOf(batch[Math.min(pos+1,batch.length-1)])}
function navigate(direction){if(busy)return;capture();const batch=visible();index=state.questions.indexOf(batch[Math.max(0,Math.min(batch.length-1,batch.indexOf(current())+direction))]);show()}
$("prev").onclick=()=>navigate(-1);$("next").onclick=()=>navigate(1);$("pending").onclick=()=>{if(busy)return;capture();nextPending();show()};
$("batch-select").onchange=()=>{if(busy)return;capture();index=state.questions.findIndex(r=>String(r.batch??0)===$("batch-select").value);show()};
$("card-toggle").onclick=()=>{const el=$("card");el.hidden=!el.hidden;$("card-toggle").setAttribute("aria-expanded",String(!el.hidden))};
for(const k of ["quote","search_log","note"])$(k).oninput=()=>changed(k);
document.addEventListener("visibilitychange",()=>{capture();resume()});window.addEventListener("pagehide",capture);
function lock(value){busy=value;for(const id of ["who-select","batch-select","prev","next","pending","retry","entry"])$(id).disabled=value}
async function hostedSave(r,label,seconds){if(!ready||!db||!uid)throw Error("Chưa nối được chỗ lưu hoặc chưa có danh tính. Nội dung đang gõ được giữ; bấm Kết nối lại.");const col=db.collection("gan_"+who);
// Recheck ownership before writing, including documents from another tab.
const snapshot=await col.get();if(snapshot.docs.some(d=>d.data().uid!==uid)){ready=false;blocked=true;throw Error("Tên đã chọn có dữ liệu của tài khoản khác. Hãy chọn đúng tên A/B; nhãn được ẩn.")}
const old=await col.doc(r.doc_id).get();if(old.exists&&old.data().worksheet_sha256!==r.worksheet_sha256)throw Error("Phiếu đã thay đổi so với nhãn lưu. Báo người điều phối; không ghi đè.");
const document={id:r.lineage_id,lineage_id:r.lineage_id,batch:r.batch??0,who,uid,seconds,label,guideline:state.guideline_version,worksheet_sha256:r.worksheet_sha256,at:new Date().toISOString()};await col.doc(r.doc_id).set(document);return document}
$("form").onsubmit=async event=>{event.preventDefault();if(busy)return;const err=errors(true);if(Object.keys(err).length){$("error").textContent="Còn mục chưa hợp lệ; xem thông báo ngay dưới ô điền.";$(Object.keys(err)[0]+"_error").scrollIntoView({block:"center"});return}capture();const r=current(),label=values(),seconds=Number(answers[r.lineage_id]?.seconds)||0;lock(true);try{let d;if(embedded)d=await hostedSave(r,label,seconds);else d=await serverSave(r,label,seconds);docs[r.lineage_id]=d;answers[r.lineage_id]={...label,seconds,baseSeconds:seconds,edited:false};remember(r);nextPending();show();$("saved").textContent="Đã lưu";$("sync").textContent="Đã lưu nhãn của bạn."}catch(e){$("error").textContent="Không lưu được: "+(e.message||e)+". Nội dung đang gõ được giữ.";if(blocked){$("identity-error").textContent=e.message;$("sheet").classList.add("hide")}}finally{lock(false);resume()}};
const sessions={};
async function openSheet(selected){const request=++generation;ready=false;blocked=false;docs={};who=selected;answers=sessions[who]||={};$("identity-error").textContent="";try{localStorage.setItem("vilextime-the4-who",who)}catch{}show();if(!who){$("sync").textContent="Chọn Tôi là A hoặc Tôi là B để bắt đầu.";return}$("sync").textContent="Đang nối chỗ lưu…";
try{const claude=window.claude;if(!claude)throw Error("Mở trang trên claude.ai khi đã đăng nhập; chỗ lưu db/user chưa sẵn sàng.");const connection=await claude.use("db");const user=await claude.use("user");const identity=user?await user.id():null;if(request!==generation)return;db=connection;uid=identity;if(!db||!user||!uid)throw Error("Chưa có db hoặc danh tính user. Giữ trang mở; bấm Kết nối lại khi claude.ai đã sẵn sàng.");const snapshot=await db.collection("gan_"+who).get();if(request!==generation)return;
const data=snapshot.docs.map(d=>d.data());if(data.some(d=>d.uid!==uid)){blocked=true;throw Error("Bạn có thể đã chọn sai tên: collection này có dữ liệu của tài khoản khác. Chọn đúng A/B. Nhãn đã được ẩn.")}
const byId=new Map(state.questions.map(r=>[r.lineage_id,r]));for(const d of data){const r=byId.get(d.lineage_id);if(r&&(d.worksheet_sha256!==r.worksheet_sha256||d.guideline!==state.guideline_version||d.who!==who))throw Error("Nhãn lưu không khớp phiếu/thẻ hiện tại. Báo người điều phối; không tải nhãn.")}
// Keep input entered during connection, then restore only this account's drafts.
capture();
for(const r of state.questions){try{const draft=JSON.parse(localStorage.getItem(draftKey(r))||"null");if(draft&&(!answers[r.lineage_id]?.edited||Number(draft.seconds)>Number(answers[r.lineage_id]?.seconds)))answers[r.lineage_id]=draft}catch{}}
for(const d of data){if(!byId.has(d.lineage_id))continue;docs[d.lineage_id]=d;const local=answers[d.lineage_id]||{},base=Number(local.baseSeconds)||0;answers[d.lineage_id]={...(local.edited?local:d.label),edited:!!local.edited,baseSeconds:Number(d.seconds)||0,seconds:Math.max(Number(d.seconds)||0,base)+Math.max(0,(Number(local.seconds)||0)-base)}}
ready=true;$("sync").textContent="Đã nối chỗ lưu; chỉ tải nhãn của tên đã chọn.";show();
}catch(e){if(request!==generation)return;ready=false;$("sync").textContent=e.message||String(e);if(blocked){checkpoint();$("identity-error").textContent=e.message;$("sheet").classList.add("hide")}}}
$("who-select").onchange=()=>{capture();openSheet($("who-select").value)};$("retry").onclick=()=>{capture();openSheet(who)};
function initialise(data){state=data;state.good=state.good||{q1:"dung",q2:"co",q3:"co",q4:"khong"};$("card-text").innerHTML=state.card_html||"Hướng dẫn 4.0 chưa được nhúng trong phiên máy chủ.";for(const batch of [...new Set(state.questions.map(r=>r.batch??0))].sort((a,b)=>a-b)){const o=node("option","Lô "+batch);o.value=String(batch);$("batch-select").append(o)}$("batch-select").value=state.questions.some(r=>r.batch===0)?"0":$("batch-select").options[0]?.value||"";index=state.questions.findIndex(r=>String(r.batch??0)===$("batch-select").value);setInterval(timer,1000)}

async function serverSave(r,label,seconds){const res=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lineage_id:r.lineage_id,label:{...label,seconds}})});const result=await res.json();if(result.errors?.length)throw Error(result.errors.join("\n"));return {label:result.label,seconds}}
if(!embedded)fetch("/api/state").then(r=>r.json()).then(data=>{if(data.errors?.length)throw Error(data.errors.join("\n"));initialise(data);who=data.who;$("who-select").value=who;$("who-select").disabled=true;$("retry").hidden=true;for(const r of state.questions){answers[r.lineage_id]=r.label;if(r.label?.q1)docs[r.lineage_id]={label:r.label}}ready=true;show()}).catch(e=>{$("sync").textContent=e.message});
/*SERVER_END*/
if(embedded){initialise(embedded);let selected="";try{selected=localStorage.getItem("vilextime-the4-who")||""}catch{}if(!["A","B"].includes(selected))selected="";$("who-select").value=selected;openSheet(selected)}
