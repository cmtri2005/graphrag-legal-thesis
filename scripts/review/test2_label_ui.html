<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViLexTime test2 — Gán theo câu hỏi</title>
<style>
:root{font:18px/1.6 system-ui,sans-serif;color:#172b38;background:#f4f6f8}body{margin:0}header{position:sticky;top:0;background:#12364a;color:white;padding:12px 24px;z-index:2;display:flex;align-items:center;gap:16px;flex-wrap:wrap}main{max-width:1400px;margin:24px auto;padding:0 20px}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #bac8d0;border-radius:5px;padding:7px 15px;background:white;color:#12364a}button.primary{background:#126352;color:white}section,.version{background:white;border:1px solid #d2dce1;border-radius:8px;padding:20px;margin:18px 0}h1{font-size:1.5rem}h2{font-size:1.15rem;margin:0 0 12px}h3{font-size:1rem}.versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.version{margin:0;min-width:0}pre,.legal{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}mark{background:#ffe3a0}strong{font-weight:800;color:#713500}label{display:block;margin:7px 0}label.inline{display:inline-block;margin-right:20px}textarea{box-sizing:border-box;width:100%;min-height:95px;border:1px solid #afbec7;border-radius:5px;padding:10px}select{max-width:100%;padding:5px}.muted{font-size:.9rem;color:#516673}.error{color:#9f1528;white-space:pre-wrap}#status{margin-left:auto}.q{border-top:1px solid #e0e7eb;padding:14px 0}.hide{display:none}a{color:#075c88}.saved{color:#126352}
</style>
<header><b>ViLexTime · test2 · thẻ 4.0</b><span id="who"></span><button id="prev">← Trước</button><button id="next">Sau →</button><button id="pending">Chưa gán</button><span id="status"></span></header>
<main><p class="muted">Gán độc lập. Mỗi phiếu là một câu hỏi với tất cả các mốc. Đọc nguồn gốc trước khi chọn Q1–Q4. Không trao đổi nhãn với người còn lại.</p><div id="empty" class="hide">Phiếu chưa có câu hỏi.</div><div id="sheet"><h1 id="question"></h1><p id="meta" class="muted"></p><div id="versions" class="versions"></div><section><h2>Văn bản gốc và văn bản tác động</h2><div id="sources"></div></section><section><h2>Bốn câu hỏi kiểm</h2><form id="form"><div id="questions"></div><label>Câu trích nguyên văn từ văn bản tác động (bắt buộc)<textarea id="quote" required></textarea></label><label>Đã tìm chuyển chỗ ở đâu? (bắt buộc nếu T6, Q4 = Không)<textarea id="search_log"></textarea></label><label>Ghi chú — chỗ mới/chỗ nghi, ý còn thiếu, hoặc [phân vân]<textarea id="note"></textarea></label><p id="verdict" class="muted"></p><p id="error" class="error" role="alert"></p><button type="submit" class="primary">Lưu và sang câu chưa gán</button><span id="saved" class="saved" role="status"></span></form></section></div></main>
<script>
"use strict";
let state,index=0;
const $=id=>document.getElementById(id);
const titles={q1:"Q1. Đáp án ở mỗi mốc có đúng văn bản không?",q2:"Q2. Câu hỏi có hỏi vào đúng phần tô màu không?",q3:"Q3. Câu hỏi có rõ không?",q4:"Q4. Có quy định nào khác đang thay cho đáp án này không?"};
const help={q1:"Đọc câu sửa đổi/bãi bỏ và điều hiệu lực; đối chiếu cả lời văn và đáp án ngắn in đậm.",q2:"Ở các mốc, người trả lời phải nói những điều khác nhau không? T6 phải hỏi nội dung, không chỉ hỏi còn/hết.",q3:"Chỉ một điều khoản trả lời được; không lộ ngày, số hiệu, Điều/Khoản hay chép sẵn đáp án.",q4:"Kiểm quy phạm khác, sắp xếp bộ máy, chuyển tiếp. T6 kiểm đủ bảy yếu tố chuyển chỗ theo hướng dẫn 3.0."};
const names={dung:"Đúng",sai:"Sai",co:"Có",khong:"Không",khong_chac:"Không chắc"};
const reasonNames={gold_wrong:"Sai phiên bản, ngày hoặc lời văn",reference_only:"Đáp án chỉ dẫn chiếu",other:"Đáp án ngắn thiếu ý",group_mismatch:"Không đúng nhóm",cosmetic_only:"Chỉ đổi hình thức",rename_only:"Chỉ đổi tên cơ quan",auto_reference_update:"Tự cập nhật dẫn chiếu",question_ambiguous:"Câu hỏi mơ hồ",unanswerable_as_asked:"Không trả lời được như câu hỏi",question_leaks:"Lộ đáp án hoặc định danh",superseded_by_other_norm:"Quy phạm khác thay cho đáp án",restructuring_2025:"Sắp xếp bộ máy 2025",transitional_rule:"Vướng quy tắc chuyển tiếp",relocated:"Đã chuyển chỗ",relocation_unclear:"Chưa chắc chuyển chỗ"};
const node=(tag,text,cls)=>{let el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el};
function link(parent,url){try{let u=new URL(url);if(!["https:","http:"].includes(u.protocol))return;let a=node("a","Mở văn bản gốc ↗");a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";parent.append(a)}catch{}}
function sourceBlock(src,title){const box=node("details");box.open=true;box.append(node("summary",title+" "+(src.document||src.number||"")));link(box,src.source_url||src.url);for(const k of ["text","passage","transitional","in_force"]){if(src[k]){box.append(node("h3",{text:"Lời văn",passage:"Đoạn tác động",transitional:"Chuyển tiếp",in_force:"Hiệu lực"}[k]));box.append(node("pre",src[k]))}}return box}
function chosen(q){return document.querySelector(`input[name="${q}"]:checked`)?.value||""}
function reasonOptions(q,old=""){const select=$(q+"_reason");select.replaceChildren(node("option","Chọn lý do…"));select.firstChild.value="";let choices=state.reasons[q][chosen(q)]||[];for(const c of choices){let o=node("option",c+" — "+(reasonNames[c]||c));o.value=c;select.append(o)}select.value=old;select.classList.toggle("hide",!choices.length);updateVerdict()}
function updateVerdict(){let qs=["q1","q2","q3","q4"], vals=qs.map(chosen);$("verdict").textContent=vals.every(Boolean)?"Nhãn suy ra: "+(vals.join("|")==="dung|co|co|khong"?"Đạt":"Không đạt"):"Trả lời đủ Q1–Q4 để suy ra nhãn."}
function show(){const r=state.questions[index];if(!r){$("empty").classList.remove("hide");$("sheet").classList.add("hide");return}$("who").textContent="Người gán "+state.who;$("status").textContent=`${index+1}/${state.questions.length} · đã lưu ${state.questions.filter(x=>x.label.verdict).length}`;$("question").textContent=r.question;$("meta").textContent=`${r.group} · ${r.stratum||""} · Lô ${r.batch??"chưa ghi"} · ${r.lineage_id}`;$("error").textContent="";$("saved").textContent="";
$("versions").replaceChildren();for(const v of r.rows){const box=node("article",undefined,"version");box.append(node("h2",v.as_of||"Chưa có mốc"));box.append(node("p",v.version_id||"Không có phiên bản còn hiệu lực","muted"));if(v.answer_status==="no_answer")box.append(node("p","Không có đáp án ở mốc này — điều khoản đã bị bãi bỏ."));if(v.marked_lead_in){box.append(node("h3","Câu dẫn (ngữ cảnh từ chuỗi phiên bản)"));const lead=node("div",undefined,"legal");lead.innerHTML=v.marked_lead_in;box.append(lead)}const legal=node("div",undefined,"legal");legal.innerHTML=v.marked_answer;box.append(legal);if(v.short_answer)box.append(node("p","Đáp án ngắn: "+v.short_answer));link(box,v.source_url);$("versions").append(box)}
$("sources").replaceChildren();let sources=r.sources||{};if(sources.base)$("sources").append(sourceBlock(sources.base,"Văn bản đích"));for(const s of sources.actors||[])$("sources").append(sourceBlock(s,"Văn bản tác động"));if(!sources.base&&!(sources.actors||[]).length)for(const v of r.rows){let s=v.source_evidence||{};if(s.base)$("sources").append(sourceBlock(s.base,"Văn bản đích"));for(const a of s.actors||[])$("sources").append(sourceBlock(a,"Văn bản tác động"))}
$("questions").replaceChildren();for(const q of Object.keys(titles)){const div=node("div",undefined,"q");div.append(node("h3",titles[q]));div.append(node("p",help[q],"muted"));for(const value of state.options[q]){let lab=node("label",undefined,"inline"),input=document.createElement("input");input.type="radio";input.name=q;input.value=value;input.required=true;input.checked=r.label[q]===value;input.onchange=()=>reasonOptions(q);lab.append(input,document.createTextNode(" "+names[value]));div.append(lab)}let sel=document.createElement("select");sel.id=q+"_reason";div.append(document.createElement("br"),sel);$("questions").append(div);reasonOptions(q,r.label[q+"_reason"]||"")}
for(const k of ["quote","search_log","note"])$(k).value=r.label[k]||"";updateVerdict()}
function nextPending(){for(let step=1;step<=state.questions.length;step++){let n=(index+step)%state.questions.length;if(!state.questions[n].label.verdict){index=n;return}}index=Math.min(index+1,state.questions.length-1)}
$("prev").onclick=()=>{index=Math.max(0,index-1);show()};$("next").onclick=()=>{index=Math.min(state.questions.length-1,index+1);show()};$("pending").onclick=()=>{nextPending();show()};
$("form").onsubmit=async event=>{event.preventDefault();const r=state.questions[index],label={};for(const q of Object.keys(titles)){label[q]=chosen(q);label[q+"_reason"]=$(q+"_reason").value}for(const k of ["quote","search_log","note"])label[k]=$(k).value;$("error").textContent="";try{const res=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lineage_id:r.lineage_id,label})});const result=await res.json();if(result.errors?.length){$("error").textContent=result.errors.join("\n");return}r.label=result.label;nextPending();show();$("saved").textContent="Đã lưu"}catch{$("error").textContent="Không lưu được. Giữ trang mở và thử lại khi máy chủ sẵn sàng."}};
fetch("/api/state").then(r=>r.json()).then(data=>{if(data.errors?.length){$("error").textContent=data.errors.join("\n");return}state=data;index=Math.max(0,state.questions.findIndex(r=>!r.label.verdict));show()}).catch(()=>{$("error").textContent="Không đọc được phiếu từ máy chủ."});
</script></html>
